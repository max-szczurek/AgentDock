name: Deploy AgentDock.Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/AgentDock/AgentDock.Web/**'
      - 'apps/AgentDock/AgentDock.Core/**'
      - '.github/workflows/deploy-agentdock-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agentdock-web
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: apps/AgentDock/AgentDock.Web/AgentDock.Web.csproj
  PUBLISH_DIR: ${{ github.workspace }}/output

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test apps/AgentDock/AgentDock.Tests

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_AGENTDOCK }}

      - name: Deploy to agentdock-staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: agentdock-staging
          package: ${{ env.PUBLISH_DIR }}
